name = "parser-stream"
main = "src/workers/worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "SessionObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionObject"]

[limits]
cpu_ms = 300000

[observability]
enabled = true

[vars]
GEMINI_MODEL = "gemini-3-flash-preview"

# Optional: `wrangler secret put GEMINI_API_KEY` lets uploads skip the key field.
# Without it, every upload brings its own key.
